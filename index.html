<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma carta para você</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Você recebeu uma carta 💌</h1>

    <div class="envelope" id="envelope">
      <div class="carta">
        <p class="mensagem">Espero que goste!</p>
        <a class="botao-continuar" id="botaoContinuar" href="proxima-pagina.html" tabindex="-1">
          Continuar
        </a>
      </div>

      <div class="aba"></div>
      <div class="frente"></div>
    </div>

    <button class="botao-abrir" id="botaoAbrir" type="button" aria-expanded="false">
      Abrir carta 💌
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
